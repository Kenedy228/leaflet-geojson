<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./index.css" />
    <title>ЛР6 ГИС</title>
  </head>
  <body>
    <div class="container my-3">
      <div class="about-container">
        <h1 class="title">Лабораторная работа №6</h1>
        <p class="description">
          Выполнил студент группы БО241ИСТ Журавлев Д.В.
        </p>
      </div>
    </div>
    <div class="map-container d-flex justify-content-between">
      <div id="map" class="mx-2"></div>
      <div class="sidebar mx-2">
        <h3 class="text-center">Панель управления</h3>
        <div class="form-check">
          <input
            class="form-check-input points-control hidden"
            type="checkbox"
            value=""
            id="flexCheckDefault"
          />
          <label class="form-check-label" for="flexCheckDefault">
            Показать точки
          </label>
        </div>
        <div class="d-grid gap-2 col-12 mx-auto">
          <button class="delete-points-control btn btn-danger display-none">
            Удалить точку
          </button>
        </div>
        <div class="form-check">
          <input
            class="form-check-input roads-control hidden"
            type="checkbox"
            value=""
            id="flexCheckDefault"
          />
          <label class="form-check-label" for="flexCheckDefault">
            Показать дороги
          </label>
        </div>
        <div class="form-check">
          <input
            class="form-check-input polygons-control hidden"
            type="checkbox"
            value=""
            id="flexCheckDefault"
          />
          <label class="form-check-label" for="flexCheckDefault">
            Показать полигоны
          </label>
        </div>
        <div class="form-check points-distance mt-3 display-none">
          <input
            class="form-check-input points-distance-control"
            type="checkbox"
            value=""
            id="flexCheckDefault"
          />
          <label class="form-check-label" for="flexCheckDefault">
            Включить режим выделения нескольких точек
          </label>
        </div>
        <div class="points-distance-info display-none">
          <p class="mt-2">Выделенные точки:</p>
          <ol class="points-distance-selected-list"></ol>
          <div class="d-grid gap-2 col-12 mx-auto">
            <button
              class="points-distance-calculate-control btn btn-primary text-center"
            >
              Посчитать дистанцию
            </button>
            <button
              class="points-distance-reset-control btn btn-danger text-center"
            >
              Сбросить
            </button>
          </div>
        </div>
        <div class="form-check add-point-control mt-3">
          <input
            class="form-check-input points-distance-control"
            type="checkbox"
            value=""
            id="flexCheckDefault"
          />
          <label class="form-check-label" for="flexCheckDefault">
            Включить режим добавления новой точки
          </label>
        </div>
        <div class="add-point-control-panel display-none">
          <p class="mt-2">Добавленные точки:</p>
          <div class="add-point-control-list">
            <div class="add-point-points-container"></div>
          </div>
          <div class="d-grid gap-2 col-12 mx-auto">
            <button class="add-point-save btn btn-primary text-center">
              Сохранить
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./index.js"></script>
    <script src="./points.js"></script>
    <script src="./roads.js"></script>
    <script src="./polygons.js"></script>
    <script src="./distance.js"></script>
    <script src="./constraints.js"></script>
    <script src="./add-point.js"></script>
    <script src="./delete-point.js"></script>
  </body>
</html>
