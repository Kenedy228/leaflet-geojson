version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: stage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    target-branch: stage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directory: /backend
    target-branch: stage
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
