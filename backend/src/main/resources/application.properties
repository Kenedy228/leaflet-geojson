spring.application.name=gis
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:gis}}
spring.datasource.username=${DB_USER:gis}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.flyway.default-schema=app
spring.flyway.schemas=app
spring.flyway.locations=classpath:db/migration,classpath:db/demo
spring.flyway.placeholders.demo_data_enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.editing.enabled=${EDITING_ENABLED:false}
app.editor.username=${EDITOR_USERNAME:editor}
app.editor.password=${EDITOR_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.main.log-startup-info=false
spring.main.banner-mode=off
logging.level.root=OFF
logging.level.com.github.gis=INFO
logging.structured.format.console=ecs
spring.jmx.enabled=false
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=false
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
