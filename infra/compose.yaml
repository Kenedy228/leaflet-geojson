name: leaflet-geojson

x-postgis: &postgis
  image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  db:
    <<: *postgis
    environment:
      POSTGRES_DB: ${DB_NAME:-gis}
      POSTGRES_USER: ${DB_USER:-gis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD using make init-env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test-db:
    <<: *postgis
    profiles: [test]
    environment:
      POSTGRES_DB: gis_test
      POSTGRES_USER: ${DB_USER:-gis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:0:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
